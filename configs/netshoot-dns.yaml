# netshoot pod for DNS server testing (BIND, unbound, dnsmasq).
#
# The container only runs an idle process. None of the DNS servers start
# automatically. Exec in and start the ones you need, in the foreground or
# backgrounded with '&':
#
#   kubectl exec -it deploy/netshoot-dns -- zsh
#
#   dnsmasq -k --port=5353 --log-queries --log-facility=- &
#   named -g -u named -p 5354 -c /etc/bind/named.conf &
#   unbound -d -c /etc/unbound/unbound.conf &      # set 'port: 5355' in the config first
#
#   dig @127.0.0.1 -p 5353 example.com
#
# To keep servers running after the exec session disconnects, start them
# inside tmux (or screen) instead, one window per server:
#
#   tmux new -s dns                 # detach: Ctrl-b d, reattach: tmux attach -t dns
#
# All three servers default to port 53, so only one can use it at a time.
# The ports below are the suggested non-conflicting ports; declaring them is
# informational and lets a Service target them if needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netshoot-dns
  labels:
    app: netshoot-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netshoot-dns
  template:
    metadata:
      labels:
        app: netshoot-dns
    spec:
      containers:
        - name: netshoot
          # Needs an image built from this repo's Dockerfile, which includes
          # bind, unbound and dnsmasq.
          image: nicolaka/netshoot
          command: ["sleep", "infinity"]
          stdin: true
          tty: true
          ports:
            - name: dnsmasq-udp
              containerPort: 5353
              protocol: UDP
            - name: dnsmasq-tcp
              containerPort: 5353
              protocol: TCP
            - name: bind-udp
              containerPort: 5354
              protocol: UDP
            - name: bind-tcp
              containerPort: 5354
              protocol: TCP
            - name: unbound-udp
              containerPort: 5355
              protocol: UDP
            - name: unbound-tcp
              containerPort: 5355
              protocol: TCP
          securityContext:
            # Lets the servers bind port 53 if you choose to use it.
            capabilities:
              add: ["NET_BIND_SERVICE"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
